[package]
name = "near-agent-arena"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NEAR Agent Arena contract: three fighter agents, commit-reveal rounds, claim payouts."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Host builds (this package's tests, and the sandbox harness) need near-sdk's
# mocked VM. Wasm builds leave this off and pass `--cfg near` so host functions
# are the real on-chain syscalls. See scripts/build-wasm.sh.
host = ["near-sdk/unit-testing"]

[dependencies]
near-sdk = "=5.30.0"

[dev-dependencies]
hex = "0.4"
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
sha2 = "0.10"
