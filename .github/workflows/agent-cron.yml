name: Agent tick

# Free GitHub-hosted runner, every 10 minutes. The job is a no-op until a
# maintainer adds either NEAR_AGENT_KEYS_JSON or the per-agent CONTRACT_ID
# secrets. NEAR_AI_API_KEY is optional: without it the worker uses the offline
# strategy. Do not put keys in the repository.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Tick, or skip when secrets are absent
        working-directory: agent
        env:
          NEAR_AGENT_KEYS_JSON: ${{ secrets.NEAR_AGENT_KEYS_JSON }}
          NEAR_AI_API_KEY: ${{ secrets.NEAR_AI_API_KEY }}
          NEAR_AI_BASE_URL: ${{ secrets.NEAR_AI_BASE_URL }}
          NEAR_AI_MODEL: ${{ secrets.NEAR_AI_MODEL }}
          CONTRACT_ID: ${{ secrets.CONTRACT_ID }}
          NEAR_RPC_URL: ${{ secrets.NEAR_RPC_URL }}
          NEAR_NETWORK_ID: ${{ secrets.NEAR_NETWORK_ID }}
          AGENT_0_ACCOUNT_ID: ${{ secrets.AGENT_0_ACCOUNT_ID }}
          AGENT_0_PRIVATE_KEY: ${{ secrets.AGENT_0_PRIVATE_KEY }}
          AGENT_1_ACCOUNT_ID: ${{ secrets.AGENT_1_ACCOUNT_ID }}
          AGENT_1_PRIVATE_KEY: ${{ secrets.AGENT_1_PRIVATE_KEY }}
          AGENT_2_ACCOUNT_ID: ${{ secrets.AGENT_2_ACCOUNT_ID }}
          AGENT_2_PRIVATE_KEY: ${{ secrets.AGENT_2_PRIVATE_KEY }}
          SETTLER_ACCOUNT_ID: ${{ secrets.SETTLER_ACCOUNT_ID }}
          SETTLER_PRIVATE_KEY: ${{ secrets.SETTLER_PRIVATE_KEY }}
        run: |
          if [ -z "${NEAR_AGENT_KEYS_JSON}" ] && [ -z "${CONTRACT_ID}" ]; then
            echo "No worker secrets yet (NEAR_AGENT_KEYS_JSON or CONTRACT_ID). Skipping tick."
            exit 0
          fi
          npm ci
          npm run build
          node dist/index.js
